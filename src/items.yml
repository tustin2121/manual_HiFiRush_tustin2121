        - name: Super High Alert
        - name: Korsica Stun Extend
        
    - { name: Rhythm Dodge Pull Cancel, trap: true }
    - { name: Instant Partner Recharge, useful: true }
    - { name: Chip Sense,               useful: true, category: [ Post-Game Only ] }
    - { name: Enemy Analyze,            useful: true, category: [ Post-Game Only ] }
    - { name: Gear Increase,            useful: true, count: 3, category: [ Post-Game Only ] }

- $common: { name: "Combo | ", category: [ Combos ], useful: true }
