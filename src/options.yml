%YAML 1.2
%OUTPUT options
%SCHEMA https://raw.githubusercontent.com/ManualForArchipelago/Manual/main/schemas/Manual.options.schema.json
---
core:
  goal:
    # Using 'goal' as the name of an option let you override some of the generated goal parameters
    display_name: The End Objective
    description: |
      How to end your randomized play-through:
      defeat kale - Win the game by defeating Kale in Track 12. Basically lets the 
        randomizer logic determine when the game ends.
      shutdown SPECTRA - Win the game by collecting the six keys and shutting down 
        SPECTRA. Requires you to beat all bosses in any order.
    # hidden: false
    aliases: 
      defeat_kale: 0
      shutdown_spectra: 1
  death_link:
    default: false
  filler_traps: # We don't have any traps
    hidden: true
    #Using values here let you set a 'recommended' filler_trap percentage or even a default percentage
    values:
      recommended: 20

user:
  safe_i18n:
    type: Toggle
    description: |
      One of the locations has non-Latin characters in it. Enable this to replace it with
      its translation, in the event that these utf8 characters cause problems in other clients.
    hidden: true
    default: false
  post_game:
    type: Toggle
    description: |
      When this option is on (the default), the logic will assume that you are playing
      on a save that has completed the first play-through of the game. This means you 
      can access any stage with any combination of partners, as well as access the
      post-game tower modes.
      
      Turning this off will adjust logic to match a first-time play-through, with linear
      access to levels and partners. Some checks that can only be accessed post-game will
      also be removed from the pool entirely. The game will still end at Kale, so no
      tower floors will be added as locations either.
      
      NOTE: Archipelago logic assumes that a player can return to previously accessible 
      locations at any time. But Hi-Fi Rush does not allow access to previous levels 
      (or even previous checkpoints of levels you are on) until after you defeat Kale,
      which is the victory condition for the randomizer. So if you turn this option off, 
      be prepared to cheat picking up missed checks if they turn out to be important.
    default: true
    aliases:
      post: true
      first: false
      new: false
    hidden: false
    group: Main Location Options 
  scoring_method:
    type: Choice
    description: |
      The baseline checks of the game.
      'chorus' adds checks beating Choruses (${chorus#} locations)
      'levels' adds checks for completing levels (${level#} locations)
      'both' adds both (${chkpt#} locations; there's some overlap)
    values:
      both: 0
      chorus: 1
      levels: 2
    default: 0
    allow_custom_value: false
    group: Main Location Options 
  moment_sanity:
    type: Toggle
    description: |
      Adds checks for various (usually unskippable) cutscenes and milestones (${moment} locations).
    default: true
    group: Main Location Options 
    
  
  #----------------------------------------------
  
  summon_rando:
    type: Toggle
    description: |
      Adds the ability to summon partners to the item pool. NOTE: The logic of this 
      randomizer only takes into account a partner's out of battle abilities. It does
      not care if you use partner abilities in-battle. This also results in the game
      being more non-linear, as several tracks can be at least entered without some
      partner summons.
    default: true
    group: Item Pool Options 
  combo_rando:
    type: Toggle
    description: |
      Adds Chai's purchasable combos to the item pool. You can implement this restriction
      in your game by selling all of the moves at the store and purchasing them back when
      the randomizer grants them to you. 
      
      NOTE: The logic does not account for needing to pick up the attacks 
      (eg, the comic book items in the world) on the first play-through.
    default: false
    group: Item Pool Options 
  special_rando:
    type: Toggle
    description: |
      Adds Chai's purchasable special attacks to the item pool. You can implement this 
      restriction in your game by either selling or just not equipping the purchasable
      special attacks. Power Chord is always available.
      
      NOTE: The logic does not account for needing to pick up the special attacks 
      (eg, the comic book items in the world) on the first play-through.
    default: false
    group: Item Pool Options 
  chip_rando:
    type: Toggle
    description: |
      Adds Chai's purchasable chips to the item pool. You can implement this restriction
      in your game by simply limiting what chips you can equip. Chip levels are progressive.
    default: false
    group: Item Pool Options 
    
  #----------------------------------------------
  
  upgrade_sanity:
    type: Toggle
    description: |
      Grant checks for picking up Life Gauge (${life}), Health Tank (${health}), 
      and Reverb Core (${reverb}) pieces (${upgrade} locations total).
      
      Note: These items are permanent collectables. If you've picked them up before 
      in your save file, they won't be present in the level.
    default: false
    group: Permanent Collectables 
  circuit_sanity:
    type: Toggle
    description: |
      Grant checks for picking up Broken Armstrong Circuits (${circuit} locations)
      
      Note: These items are permanent collectables. If you've picked them up before 
      in your save file, they won't be present in the level.
    default: false
    group: Permanent Collectables 
  comic_sanity:
    type: Toggle
    description: |
      Grant checks for picking up moves / Comic Books in the world (${comic} locations)
      
      Note: These items are permanent collectables. If you've picked them up before 
      in your save file, they won't be present in the level.
    default: false
    group: Permanent Collectables 
  achievement_sanity:
    type: Range
    description: |
      Grant checks for completing achievements on the Wall-of-Fame. 
      Unavailable when doing a post-game rando (see bucketlist_sanity for the post-game version).
      
      The following options are available:
      0 - No achievements are required.
      1 - (${achieve-1} checks) Level 1 achievements, easy achievements that usually will be completed by just playing the game
      2 - (${achieve-2} checks) Level 2 achievements, those able to be completed by the end of a single play-through
      3 - (${achieve-3} checks) Level 3 achievements, completable with several play-throughs
      4 - (${achieve-4} checks) All achievements
      
      Do not set this higher than 2 unless you're doing an async. 
      (Also, with the "Defeat Kale" goal, anything higher than 2 is moot anyway.)
    range_start: 0
    range_end: 4
    default: 1
    group: Permanent Collectables 
  
  #----------------------------------------------
  
  vlog_sanity:
    type: Toggle
    description: |
      Grant checks for reading PDAs (${vlog} locations)
    default: false
    group: Static Collectables 
  graffiti_sanity:
    type: Toggle
    description: |
      Grant checks for finding Graffiti (${graffiti} locations)
    default: false
    group: Static Collectables 
  statue_sanity:
    type: Toggle
    description: |
      Grant checks for destroying golden statues of Kale (${statue} locations)
    default: false
    group: Static Collectables 
  announcement_sanity:
    type: Toggle
    description: |
      Grant checks for shooting the Hovering Announcement Drones with Peppermint (${board} locations)
      If you hear a disembodied announcement at any point during a level, there's probably a flying 
      billboard nearby broadcasting it. Shooting the bot will end the announcement.
    default: false
    group: Static Collectables 
  vending_sanity:
    type: Toggle
    description: |
      Grant checks for breaking vending machines (${vend} locations)
    default: false
    group: Static Collectables 
  terminal_sanity:
    type: Toggle
    description: |
      Grant checks for accessing shop terminals (${shop} locations)
    default: true
    group: Static Collectables 
  bucketlist_sanity:
    type: Toggle
    description: |
      Grant checks for doing certain things (${bucket-1} locations)
      Like achievements on the Wall-of-Fame but for a post-game rando. 
      Unavailable when doing a first-game rando (see achievement_sanity for the new game version).
    default: true
    group: Static Collectables 
  
  #----------------------------------------------
  
  robo_sanity:
    type: Choice
    description: |
      'smidge' adds checks for talking to Smidge (${smidge} locations)
      'recurring' additionally adds checks for talking to HR and the Tanning robot (${npc#2} locations)
      'interesting' additionally adds checks for additional interesting NPC interactions (${npc#3} locations total)
      'all' adds checks for interacting with all NPCs (${npc#4} locations total)
      'none' does not add these checks
    values:
      none: 0
      smidge: 1
      recurring: 2
      interesting: 3
      all: 4
    default: 1
    allow_custom_value: false
    group: Static Collectables 
  scrub_sanity:
    type: Toggle
    description: |
      Why would you want to hurt those poor SCR-UB bots? They're only doing their jobs!
      But if you feel like murdering the defenseless working class of Vandelay Island,
      this option adds ${scrub} locations.
    default: false
    group: Static Collectables 
  door_sanity:
    type: Choice
    description: |
      'touch' adds checks for finding SPECTRA doors (8 locations).
      'beat' additionally adds checks for completing the challenges inside (8 more locations).
      'none' does not add these checks.
    values:
      none: 0
      touch: 1
      beat: 2
    default: 0
    allow_custom_value: false
    group: Static Collectables 
  
  #----------------------------------------------
    
  drone_sanity:
    type: Toggle
    description: |
      Grant checks for finding the technician's drones on Track 5 (${drone} locations)
    default: false
    group: Level-Specific Sanity 
  party_sanity:
    type: Toggle
    description: |
      Grant extra checks at the start of Track 8 (${npc8} locations). These all overlap with robo_sanity.
      If robo_sanity is set to 'all', no locations are added.
      If robo_sanity is set to 'interesting', ${npcB8} locations are added.
      
      This is mainly because that opening area is big and interesting and it's a cool place to 
      add checks prior to needing Korsica to continue.
    default: true
    group: Level-Specific Sanity 
  
  #----------------------------------------------
    
  easter_sanity:
    type: Toggle
    description: |
      Include checks for activating easter eggs in the game.
      Adds ${easter-post} locations when post_game is true.
      Adds ${easter-first} locations when post_game is false.
    default: false
    group: Esoterica Sanity
  snail_sanity:
    type: Toggle
    description: |
      Include checks for finding Tango-Chan (the snail that looks like the logo for
      Tango Gameworks) hidden once in almost every level (${snail} locations).
    default: false
    group: Esoterica Sanity
  
  #----------------------------------------------
  
  tower_sanity:
    type: Range
    description: |
      Adds Rhythm Tower to the check pool. Select how many floors you wish to include in the pool.
      Each floor is another location. This is always available from the post-game hideout, and
      may provide distraction when BK'd elsewhere, but it can be difficult to get far.
    range_start: 0
    range_end: 60
    default: 0
    values:
      none: 0
      basic: 10
      half: 30
      full: 60
      qa: 10
      rekka: 20
      korsica: 30
      museum: 30
      mimosa: 40
      roquefort: 50
      kale: 60
    group: Sanity Options 
  power_sanity:
    type: Range
    description: |
      Adds Power Up! Tower Up! to the check pool. Select how many floors you wish to include in the pool.
      Each floor is another location. This is always available from the post-game hideout, and
      may provide distraction when BK'd elsewhere, but it can be difficult to get far.
    range_start: 0
    range_end: 25
    default: 0
    values:
      none: 0
      basic: 5
      full: 25
    group: Sanity Options 
  rush_sanity:
    type: Range
    description: |
      Adds BPM RUSH! to the check pool. Select how many waves you wish to include in the pool.
      Each wave is another location. This is always available from the post-game hideout, and
      may provide distraction when BK'd elsewhere, but it can be difficult to get far.
    range_start: 0
    range_end: 6 # TODO: Figure out how far this is
    default: 0
    values:
      none: 0
      basic: 3
      full: 6
    group: Sanity Options 
    
  
