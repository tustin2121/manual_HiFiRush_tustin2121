  yaml_option: [ bucketlist_sanity, post_game ]
30. Wall of Fame:
  yaml_option: [ achievement_sanity, "!post_game" ]


First-Game Only:
  yaml_option: [ "!post_game" ]
  hidden: true
Post-Game Only:
  yaml_option: [ post_game ]
  hidden: true
Easter Eggs:
  yaml_option: [ easter_sanity ]
  hidden: true
Level:
  hidden: true