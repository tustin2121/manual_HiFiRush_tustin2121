%YAML 1.2
%OUTPUT locations
%SCHEMA https://raw.githubusercontent.com/ManualForArchipelago/Manual/main/schemas/Manual.regions.schema.json
%SCHEMA https://raw.githubusercontent.com/ManualForArchipelago/Manual/main/schemas/Manual.locations.schema.json
---
# NPCs
smidge:       { requires: "{YamlCompare(robo_sanity >= 1)}", category: [ NPC ], c: [ smidge, robo1, robo2 ] } # Recurring character Smidge
noir:         { requires: "{YamlCompare(robo_sanity >= 2)}", category: [ NPC ], c: [ noir,   robo1, robo2 ] } # Recurring characters SEB-AAA and JSF-001
tan:          { requires: "{YamlCompare(robo_sanity >= 2)}", category: [ NPC ], c: [ tan,    robo1, robo2 ] } # Recurring character Tanning SBR-001
npc:          { requires: "{YamlCompare(robo_sanity >= 2)}", category: [ NPC ], c: [ npc,    robo1, robo2 ] } # Interesting NPC interactions (usually hitting)
npcB:         { requires: "{YamlCompare(robo_sanity >= 3)}", category: [ NPC ], c: [ npcB,          robo2 ] } # Boring NPCs, simply talkable
npc_8:        { requires: "({YamlCompare(robo_sanity >= 2)} or {YamlEnabled(party_sanity)})", category: [ NPC, Party - Track 8 ], c: [ npc_8, npc,  robo1, robo2 ] } # NPCs at the start of Track 8, for added checks
npcB8:        { requires: "({YamlCompare(robo_sanity >= 3)} or {YamlEnabled(party_sanity)})", category: [ NPC, Party - Track 8 ], c: [ npcB8, npcB, robo2 ] } # NPCs at the start of Track 8, for added checks
scrub:        { requires: "{YamlEnabled(scrub_sanity)}", category: [ SCR-UB ] }
# Permanent Collectables
life:         { requires: "{YamlEnabled(upgrade_sanity)}", category: [ Upgrades ], c: [ upgrade, life ] }
health:       { requires: "{YamlEnabled(upgrade_sanity)}", category: [ Upgrades ], c: [ upgrade, health ] }
reverb:       { requires: "{YamlEnabled(upgrade_sanity)}", category: [ Upgrades ], c: [ upgrade, reverb ] }
circuit:      { requires: "{YamlEnabled(circuit_sanity)}", category: [ Circuit ] }
comic:        { requires: "{YamlEnabled(comic_sanity)}", category: [ Comics ] }
achieve:      { requires: "{YamlCompare(achievement_sanity)} and YamlDisabled(post_game)}", category: [ Achievement ] }
# Static Collectables
vlog:         { requires: "{YamlEnabled(vlog_sanity)}", category: [ Vlogs ] }
door:         { requires: "{YamlCompare(door_sanity >= 1)}", category: [ Doors ] }
spectra:      { requires: "{YamlCompare(door_sanity >= 2)}", category: [ Doors ], t: [ post ] }
graffiti:     { requires: "{YamlEnabled(graffiti_sanity)}", category: [ Graffiti ] }
statue:       { requires: "{YamlEnabled(statue_sanity)}", category: [ Statues ] }
board:        { requires: "{YamlEnabled(announcement_sanity)} and |Peppermint Summon|", category: [ Announcement Drones ] }
vend:         { requires: "{YamlEnabled(vending_sanity)}", category: [ Vending Machine ] }
drone:        { requires: "{YamlEnabled(drone_sanity)}", category: [ Drones - Track 5 ] }
moment:       { requires: "{YamlEnabled(moment_sanity)}", category: [ Moment ] } # Like cut scenes and milestones in the level that don't fall under the below
# Esoterica 
easter:       { requires: "{YamlEnabled(easter_sanity)}", category: [ Easter Eggs ], c: [ easter-first, easter-post ] }
easter-first: { requires: "{YamlEnabled(easter_sanity)} and YamlDisabled(post_game)}", category: [ Easter Eggs ], c: [ first ] }
easter-post:  { requires: "{YamlEnabled(easter_sanity)} and YamlEnabled(post_game)}",  category: [ Easter Eggs ], c: [ post ] }
snail:        { requires: "{YamlEnabled(snail_sanity)}", category: [ Snail ] }
# Level Logic
post:         { requires: "{YamlEnabled(post_game)}" }
first:        { requires: "{YamlDisabled(post_game)}" }
pepper:       { requires: "|Peppermint Summon|" }
macaron:      { requires: "|Macaron Summon|" }
korsica:      { requires: "|Korsica Summon|" }
chorus:       { requires: "{YamlCompare(scoring_method != 2)}", category: [ Chorus ], c: [ chorus#, chkpt# ] }
level:        { requires: "{YamlCompare(scoring_method != 1)}", category: [ Level ], c: [ level#, chkpt# ] }
boss:         { category: [ Chorus, Level ], c: [ chorus#, level#, chkpt# ] }

achieve-1:    { requires: "{YamlCompare(achievement_sanity >= 1)} and YamlDisabled(post_game)}", category: [ Achievement ], c: [ achieve-1, achieve-2, achieve-3, achieve-4 ] }
achieve-2:    { requires: "{YamlCompare(achievement_sanity >= 2)} and YamlDisabled(post_game)}", category: [ Achievement ], c: [ achieve-2, achieve-3, achieve-4 ] }
achieve-3:    { requires: "{YamlCompare(achievement_sanity >= 3)} and YamlDisabled(post_game)}", category: [ Achievement ], c: [ achieve-3, achieve-4 ] }
achieve-4:    { requires: "{YamlCompare(achievement_sanity >= 4)} and YamlDisabled(post_game)}", category: [ Achievement ], c: [ achieve-4 ] }

---
#=====================================================================================================================#
# region - Track List
- $common: 
    region:
      name: Hideout_PostGame
      requires: "{YamlEnabled(post_game)}"
      connects_to: [ Track_1, Track_2, Track_3, Track_4, Track_5, Track_6, Track_7, Track_8, Track_9, Track_10, Track_11, Track_12, Rhythm_Tower, Power_Tower, Rush_Tower ]
      starting: true
    category: [ 00. Hideout ]
  $for:
    - name: Hideout Couch (Free Item)
      place_item: # Make sure the player starts with access to a decent track
        - Track 1 Access
        - Track 2 Access
      # - Track 3 Access  # Requires Peppermint too soon
      # - Track 4 Access  # Requires both Macron and Peppermint too soon
        - Track 5 Access
        - Track 6 Access
      # - Track 7 Access  # Requires both Macron and Peppermint too soon
        - Track 8 Access
        - Track 9 Access
        - Track 10 Access
    - { name: Play Patty Cake with 808, t: [ moment ], hint: "There's more than one animation of Chai playing with 808, btw." }

- $common: 
    region: 
      name: StartGame
      requires: "{YamlDisabled(post_game)}"
      connects_to: [ Track_1 ]
      starting: true
  $for: []
    # - { name: Project Armstrong Pass, category: [ Collectable ], place_item: [ Track 1 Access ]  }

#---------------------------------------------------------------------------------------------------------------------#
# region - Track 1: A Fresh Start
- $common: { name: Track 1, category: [ 01. A Fresh Start ] }
  $for:
    # Should be 1 Reverb, 1 Tank, 3 Life, 4 Circuit, 5 Vlogs
    - $common:
        region: { name: Track_1, requires: "|Track 1 Access|", connects_to: [ Track_2 ] }
      $for:
        - { name: NPC | Admire O5-KAR's stack,       t: [ npc ],                   hint: "Turn around at the start" }
        - { name: NPC | SCR-UB admires jumping,      t: [ npcB ],                  hint: "While in hospital gown still" }
      # - { name: SCR-UB | Shiny Floors,             t: [ scrub ],                 hint: "While in hospital gown still. Can't kill this one." }
        - { name: NPC | It's been a privilege,       t: [ npcB ],                  hint: "While in hospital gown still" }
        - { name: NPC | CAR-11E's Spill,             t: [ npcB ],                  hint: "While in hospital gown still" }
        - { name: Please collect your belongings,    t: [ moment ] }
        # -------------------
        - { name: Chorus 1 | Is he resisting?,          t: [ chorus ],                hint: "Is he resisting?" }
        - { name: His attacks sync up with the music!,  t: [ moment ] } # Unskippable bit of the tutorial
        - { name: Chorus 2 | That's the Defect!,        t: [ chorus ],                hint: "That's the defect!!" }
        - { name: Snail | Musical Pigeons,              t: [ snail ],                 hint: "With the pigeons to the left of the entrance area, next to the fountain." }
        - { name: Smidge | Light and Heavy Attacks,     t: [ smidge ],                hint: "After Chorus 2, tutorial for heavy and light attacks" }
        # -------------------
        - { name: Chorus 3 | You looking for me?,       t: [ chorus ],                hint: "Hey! You looking for me?" }
        - { name: Yelling like this is awkward!,        t: [ moment ] } # Unskippable bit
        - { name: PA | Rekka's Looking For Slackers,    t: [ board, post ],           hint: "Flying between the Chorus 3 arena and the ledge Smidge is on." }
        - { name: NPC | Interrupt SBR-001's Tan,        t: [ tan ],                   hint: "Above the 3rd Chorus arena." }
        - { name: Smidge | Dodging,                     t: [ smidge ],                hint: "After Chorus 3, dodging tutorial." }
        - { name: NPC | SEB-AAA and JSF-001,            t: [ noir, pepper, post ],    hint: "The platform directly above the second Smidge" }
        - { name: Armstrong Circuit | HR Complaint,     t: [ circuit, pepper, post ], hint: "Listen to the Noir Investigator ramble." }
        # -------------------
        - { name: HOST SYNCHRONIZED,                 t: [ moment ] }
        - { name: Upgrade | Life Gauge Piece 1,      t: [ life ],               hint: "The room to the right of Smidge after the beat hit tutorial." }
        - { name: Smidge | Beat Hits,                t: [ smidge ],             hint: "The Beat Hit tutorial" }
        - { name: Chorus 4 | Whoa...,                t: [ chorus ],             hint: "Top of the building" }
        - { name: Upgrade | Life Gauge Piece 2,      t: [ life ],               hint: "On top of the water tower after Chorus 4." }
        - { name: Vlog | TO ALL EMPLOYEES,           t: [ vlog ],               hint: "Near some crates next to 2 robots after Chorus 4." }
        - { name: NPC | Kale in the flesh!,          t: [ npcB ],               hint: "Near the TO ALL EMPLOYEES vlog." }
        - { name: Smidge | The Environment,          t: [ smidge ],             hint: "The environment reacts to the beat" }
        - { name: Smidge | Dodging to the Beat,      t: [ smidge ],             hint: "Same smidge, different location" }
        - { name: PA | New Day of the Week Added,    t: [ board, post ],        hint: "Flying around the rooftop Smidge is on." } # TODO double check
        - { name: Find the SPECTRA Door,             t: [ door ],               hint: "After Chorus 4 and encountering the Smidge that tells you about the world's rhythm, there is a ledge behind him that can be dropped down onto." }
        - { name: Beat the SPECTRA Challenge,        t: [ spectra ],            hint: "Defeat all enemies within 4 seconds, but the timer only ticks down when you're on the ground." } # Gives Armstrong Circuit
        - { name: Smidge | Rest Combos,              t: [ smidge ],             hint: "The rest combo" }
        # -------------------
        - { name: Lotta shortcuts around here...,    t: [ moment ]}
        - { name: Vlog | Battery Pack Production,    t: [ vlog ],               hint: "After the 2D section, near an illuminated hole in the ground, on the computer." }
        # ----- Battery Production -----
        - { name: "Well, you're not dead!",          t: [ moment ]}
        - { name: Smidge | Special Attacks,          t: [ smidge ],             hint: "After the special attack tutorial" }
        - { name: Chorus 5 | Rekka wants him wasted, t: [ chorus ],             hint: "Rekka wants him Wasted! So let's waste him!"}
        - { name: Vlog | Old-gen EOL Reminder,       t: [ vlog ],               hint: "On the floor of the adjacent room directly after the first fight with the GNR-020's." }
        - { name: Chest | Health Tank Piece 1,       t: [ health, treasure ],   hint: "Inside the treasure chest robot in the area above the third PDA." }
        # ----- Conveyor Belt Area -----
        - { name: Upgrade | Reverb Core Piece 1,          t: [ reverb ],             hint: "On the far end of the first conveyor belt in the production building after Chorus 5." }
        - { name: Uh oh... Power's out...,                t: [ moment ]}
        - { name: NPC | End their Argument,               t: [ npc ],                hint: "After the generator QTE, stop the arguing robots with a good slap to the face." }
        - { name: SCR-UB | Catwalk 1,                     t: [ scrub ]}
        - { name: Armstrong Circuit | Z-Shielded,         t: [ circuit,  macaron, korsica, post ], hint: "Through the Z-shielded door on a catwalk in the area to the right after reactivating the generator." }
        - { name: Graffiti | QA Building,                 t: [ graffiti, macaron, korsica, post ], hint: "Behind the Z-Shielded door, up the generator-supplied platforms." }
        - { name: SCR-UB | Catwalk 2,                     t: [ scrub ]}
        - { name: Chorus 6 | Tough Enemies,               t: [ chorus ],             hint: "Tough enemies tutorial" }
        - { name: PA | Sick Days Must Be Scheduled,       t: [ board, post ],        hint: "Flying around the Chorus 6 arena." }
        - { name: Vlog | RE RE RE Get on this!,           t: [ vlog ],               hint: "In a tucked away area behind directly behind the fight with the BA-B00." }
        - { name: NPC | Ruin the Robot's High Score,      t: [ npc ],                hint: "After Chorus 6" }
        - { name: Chorus 7 | Jumping Totally Prohibited,  t: [ chorus ],             hint: "Jumping is strictly prohibited!" }
        # -------------------
        - { name: NPC | Destroy O5-KAR's stack,           t: [ npc ],                     hint: "In the entrance to the QA center." }
        - { name: Vlog | O5-KAR Unit Musings,             t: [ vlog ],                    hint: "On a computer in front of the entrance to the QA center." }
        - { name: Upgrade | Life Gauge Piece 3,           t: [ life ],                    hint: "In the same room as PDA #5, on the upper level." }
        - { name: Armstrong Circuit | QA Lobby,           t: [ circuit,  korsica, post ], hint: "On the opposite side of the QA lobby, on the upper level" }
        - { name: Graffiti | Crane Holding Up Containers, t: [ graffiti, korsica, post ], hint: "Just before the QA-1MIL fight, in the room behind the flaming doorway." }
        # -------------------
        - { name: Explode QA-1MIL,    t: [ boss ],    hint: "You've got a killer track, but every song's gotta end!" }
        
        # TODO Collectables
        - { name: Armstrong Circuit | ???,           t: [ circuit, post ], hint: "???" }

#endregion
#---------------------------------------------------------------------------------------------------------------------#
# region - Track 2: Power Up
- $common: { name: Track 2, category: [ 02. Power Up ] }
  $for:
    # Should be 2 Reverb, 1 Tank, 3 Life, 5 Circuit, 6 Vlogs
    - $common:
        region: { name: Track_2, requires: "|Track 2 Access|", connects_to: [ Track_2_2 ] }
      $for:
        - { name: NPC | Hit the Vending Machine,         t: [ npc ],     hint: "Before entering the building to the right." }
        - { name: Vending Machine | Outside,             t: [ vend ],    hint: "Before entering the building to the right." }
        - { name: Vlog | Unsent Complaint,               t: [ vlog ],    hint: "Before entering the building, inside the area to the left." }
        # Vandelay statues in the lobby
        - { name: Kale and the old Vandelay Boss,        t: [ moment ]}
        - { name: Chorus 1 | There goes our low profile, t: [ chorus ],  hint: "Uh oh..." }
        - { name: NPC | CAR-11E's Unrealistic Goals,     t: [ npcB ],    hint: "At the bottom of the box stack" }
        - { name: Upgrade | Reverb Core Piece 1,         t: [ reverb ],  hint: "At the top of the box stack, on the overhead catwalk." }
        - { name: Vlog | HR Auto-Surveillance Recording, t: [ vlog ],    hint: "Inside the control room of the huge room." }
        - { name: Vending Machine | Control Room,        t: [ vend ],    hint: "Inside the control room of the huge room." }
        - { name: You won't be able to make that jump.,  t: [ moment ]} # Unskippable magnet tutorial
        # -------------------
        - { name: PA | A Music Fighting Intruder?,        t: [ board ],           hint: "Flying overhead before Chorus 2." }
        - { name: Armstrong Circuit | Chorus 2,          t: [ circuit, macaron, post ], hint: "Around behind and under the platform approaching Chorus 2" }
        - { name: Chorus 2 | A Music Fighting Intruder?, t: [ chorus ],          hint: "We're supposed to watch out for a... music fighting intruder?" }
        - { name: SCR-UB | Fire Door 1,                  t: [ scrub ]}
        - { name: SCR-UB | Fire Door 2,                  t: [ scrub ]}
        - { name: Armstrong Circuit | High Tram Line,    t: [ circuit, post ],   hint: "Though the flaming door above the catwalks over Chorus 2, going to the left on the pipes, jumping across tram lines." }
        - { name: Graffiti | Robot Portrait,             t: [ graffiti, korsica, post ], hint: "Though the flaming door above the catwalks over Chorus 2, going to the right along the pipes to the area in the back." }
        - { name: "Vlog | HR Claim #324839028555180850195", t: [ vlog ],         hint: "Ride the tram cars going under the platform and arena." }
        - { name: Snail | Fighting the Music,            t: [ snail ],           hint: "Near the HR Claim vlog, find the logo-snail fighting off music notes like flies." }
        - { name: Smidge | Magnet Pull,                  t: [ smidge ],          hint: "After Chorus 2, magnet tutorial" }
        - { name: Graffiti | Production Machine,         t: [ graffiti ],        hint: "Found in a room to the left of Smidge, up some boxes." }
        - { name: Golden Kale Statue | Near Vent,        t: [ statue ],          hint: "Just after pulling yourself up by 3 magnet points." }
        - { name: SCR-UB | In Vent,                      t: [ scrub ]}
        # -------------------
        - { name: Chorus 3 | Production SEC-B,           t: [ chorus ],          hint: "After the vent" }
        - { name: Upgrade | Reverb Core Piece 2,         t: [ reverb ],          hint: "Hidden in the back after the Chorus." }
        # Area 04: Shop terminals introduced
        - { name: Upgrade | Life Gauge Piece 1,          t: [ life ],            hint: "In the rafters of the large room after the shop terminal." }
        - { name: NPC | VA-SER Taught Rekka Everything,  t: [ npcB ],            hint: "In one of the side rooms of Area 04" }
        - { name: Chorus 4 | Crush Control,              t: [ chorus ],          hint: "After the first Rhythm Jump." }
        - { name: PA | Machine Press,                    t: [ board ],           hint: "Hovering just out of sight behind the first machine press." }
        - { name: Chorus 5 | Machine Press,              t: [ chorus ],          hint: "Past the press machines." }
        - { name: Chest | Armstrong Circuit 1,           t: [ circuit, treasure, korsica, post ], hint: "Inside the treasure chest robot past the fire door after Chorus 5." }
        - { name: NPC | A Corporate Slap in the Face,    t: [ npcB ],            hint: "Control room between machine press and Chorus 6" }
        - { name: Armstrong Circuit | Z-Walled,          t: [ circuit, macaron, post ], hint: "Past the Z-Wall after Chorus 5." }
        - { name: Chorus 6 | LOCKDOWN SMACKDOWN,         t: [ chorus ],          hint: "You're on LOCKDOWN and getting the SMACKDOWN!" }
        - { name: Vlog | Tram Line Issues,               t: [ vlog ],            hint: "Just outside the Chorus 6 arena." }
        # Grapple tram line ride!
        - { name: You don't even know where this rail goes!, t: [ moment ]}
        - { name: NPC | OS-KAR's Impressed,              t: [ npcB ],            hint: "After the hook rail line" }
        # Peppermint Summon given here
    - $common:
        region: { name: Track_2_2, requires: "|Peppermint Summon|", connects_to: [ Track_3 ] }
      $for:
        - { name: 'Vlog | Introducing "The Arrow!"',    t: [ vlog ],              hint: "After Peppermint allows you across the gap." }
        - { name: Chorus 7 | Shield Upgrade,            t: [ chorus ],            hint: "Looks like somebody got an upgrade." }
        - { name: Find the SPECTRA Door,                t: [ door ],              hint: "Located above the battle area of Chorus 7, on a platform accessed by jumping off the shipping containers that help the player move on; perform an Air Dodge to cover more distance" }
        - { name: Beat the SPECTRA Challenge,           t: [ spectra ],           hint: "Defeat enemies within the time limit, but they can only be damaged for 12 beats after a parry." } # Gives Health Tank
        - { name: Smidge | Peppermint,                  t: [ smidge ],            hint: "After Chorus 2, Peppermint tutorial" }
        - { name: Chorus 8 | Flying Enemies,            t: [ chorus ],            hint: "Flying enemies!" }
        - { name: NPC | Shoot the Lounging Robot,       t: [ npc, pepper ],       hint: "After Chorus 8" } # 
        - { name: Chest | Armstrong Circuit 2,          t: [ circuit, treasure, korsica, post ], hint: "Inside the treasure chest robot past the fire door after the platforming section." }
        - { name: Vending Machine | Shop Terminal,      t: [ vend ],              hint: "In the room with the shop terminal." }
        # "Teamwork! Hooray...!"
        - { name: Chest | Life Gauge Piece 2,           t: [ life, treasure ],    hint: "Inside the treasure chest robot after the three-part steam ride." }
        - { name: NPC | SCR-UB's Discontent,            t: [ npc, pepper, quest ], hint: "After Mimosa hypes her upcoming show." } # Gives Life Gauge
        - { name: PA | Lottery for the Armstrong Festival, t: [ board ],          hint: "Flying around the Chorus 6 arena." }
        - { name: Chorus 9 | Area 13,                   t: [ chorus ] }
        # The anteroom before Rekka
        - { name: Vending Machine | Waiting Room,       t: [ vend ],      hint: "In the anteroom before Rekka." }
        - { name: Vlog | Behind The Showmanship,        t: [ vlog ],      hint: "In the anteroom before Rekka." }
        - { name: SCR-UB | Waiting Room 1,              t: [ scrub ],     hint: "In the anteroom before Rekka." }
        - { name: SCR-UB | Waiting Room 2,              t: [ scrub ],     hint: "In the anteroom before Rekka." }
        - { name: NPC | SEB-AAA and JSF-001,            t: [ noir ],      hint: "In the anteroom before Rekka." }
        - { name: Graffiti | Rekka,                     t: [ graffiti ],  hint: "In the anteroom before Rekka." }
        # -------------------
        - { name: Defeat Rekka,                         t: [ boss ] }
        
        # TODO Collectables
        - { name: Upgrade | Health Tank Piece 1,      t: [ health ],   hint: "???" }
        - { name: Upgrade | Life Gauge Piece 3,       t: [ life ],     hint: "???" }

#endregion
#---------------------------------------------------------------------------------------------------------------------#
# region - Track 3: Trial By (Volcanic) Fire
- $common: { name: Track 3, category: [ 03. Trial By (Volcanic) Fire ] }
  $for:
    # Should be 2 Reverb, 1 Tank, 4 Life, 6 Circuit, 11 Vlogs
    - $common:
        region: { name: Track_3, requires: "|Track 3 Access|", connects_to: [ Track_3_2 ] }
      $for:
        - { name: PA | Starting Off,      t: [ board ],  hint: "As soon as you enter the level." }
        - { name: Chorus 1 | You're not part of my crew!, t: [ chorus ], hint: "You're not part of my crew!" }
        - { name: Vlog | R&D Service Log 1,               t: [ vlog ],   hint: "Just after Chorus 1" }
        # Shoot down a rock to continue
    - $common:
        region: { name: Track_3_2, requires: "|Peppermint Summon|", connects_to: [ Track_4 ] }
      $for:
        - { name: Armstrong Circuit | Under Platform,   t: [ circuit ],            hint: "After shooting down the rock, the underside of the next platform." }
        - { name: NPC | VA-SER Can't Feel Heat,         t: [ npcB ],               hint: "Before the generator"}
        - { name: Snail | Practically Melting,          t: [ snail ],              hint: "Below the generator platform, the logo-snail is having a rough time."}
        # Start a generator -------
        - { name: NPC | VA-SER Goes Fishing,            t: [ npcB ],               hint: "After the generator" }
        - { name: Chorus 2 | Missing A Great View,      t: [ chorus ],             hint: "You are missing this great view, Peppermint!" }
        - { name: Armstrong Circuit | Great View,       t: [ circuit ],            hint: "To the left of the 'great view' that Chai points out." }
        - { name: PA | Perfectly Safe,                  t: [ board ],              hint: "In the area where LU-C1LLE tells you that the volcano is safe, a board is flying around above." }
        - { name: Upgrade | Health Tank Piece 1,        t: [ health ],             hint: "In the corner of the volcano area." }
        # -------------------
        - { name: Chorus 3 | Got a Weird One!,          t: [ chorus ],             hint: "We got a weird one!" }
        - { name: Armstrong Circuit | Chorus 3,         t: [ circuit ],            hint: "To the left behind a box as you leave Chorus 3's arena." }
        - { name: NPC | There's Arrows Everywhere!,     t: [ npcB ],               hint: "Between Chorus 3 and 4" }
        - { name: Vending Machine | Work Site,          t: [ vend ],               hint: "Between Chorus 3 and 4" }
        - { name: Vlog | R&D Service Log 2,             t: [ vlog ],               hint: "Between Chorus 3 and 4, opposite the vending machine" }
        - { name: Upgrade | Reverb Core Piece 1,        t: [ reverb, macaron, post ],   hint: "Behind the Z-Wall between Chorus 3 and 4." }
        - { name: Graffiti | Flowers,                   t: [ graffiti, macaron, post ], hint: "Near a small camp where a PGR-0101 and a VA-SER are talking, behind the two bots is a Z-Shielded wall." }
        # -------------------
        - { name: Chorus 4 | Lava Stairs,               t: [ chorus ] }
        - { name: Vlog | R&D Service Log 3,             t: [ vlog ],               hint: "After Chorus 4" }
        - { name: Chest | Life Gauge Piece 1,           t: [ life, treasure ],     hint: "Inside the treasure chest robot after Chorus 4." }
        - { name: Vlog | R&D Service Log 4,             t: [ vlog ],               hint: "Before the rail" }
        # -------------------
        - { name: Here we ARE & D!,                     t: [ moment ]}
        - { name: Vlog | Zanzo's Order Request,         t: [ vlog ],         hint: "Outside R&D and down to the left." }
        - { name: Vending Machine | Bench Seat,         t: [ vend ],         hint: "Outside R&D and down to the left." }
        - { name: Armstrong Circuit | Cardboard,        t: [ circuit ],      hint: "Behind the Cardboard Cutout outside R&D." }
        - { name: Knock Cardboard Zanzo into the Lava,  t: [ npc ],          hint: "Achievement 'He's So Hot Right Now'. The best cutout to use is outside R&D down to the left." }
        - { name: Armstrong Circuit | Outside R&D,      t: [ circuit ],      hint: "Outside R&D and up to the left." }
